<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Cam 相机布局与步道 3D 场景</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171b22;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  .cam-label {
    color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px;
    background: rgba(20,24,32,.78); border: 1px solid rgba(255,255,255,.18);
    white-space: nowrap; transform: translateY(-6px);
    pointer-events: none; user-select: none;
  }
  .zone-label {
    color: #cfd6e4; font-size: 11px; padding: 1px 6px; border-radius: 8px;
    background: rgba(20,24,32,.55); pointer-events: none; user-select: none;
    white-space: nowrap;
  }
  #panel {
    position: fixed; top: 14px; left: 14px; width: 300px; max-height: calc(100vh - 28px);
    overflow-y: auto; color: #dfe6f0; background: rgba(18,22,30,.88);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    padding: 14px 16px; font-size: 12.5px; backdrop-filter: blur(6px);
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #panel h2 { font-size: 12px; margin: 14px 0 6px; color: #9fb0c8;
    border-top: 1px solid rgba(255,255,255,.1); padding-top: 10px; }
  #panel .sub { color: #8fa0b8; font-size: 11px; margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: space-between; margin: 3px 0; }
  .stat-row .v { color: #fff; font-variant-numeric: tabular-nums; }
  .cam-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cam-row .name { flex: 1; }
  .cam-row .meta { color: #8fa0b8; font-size: 11px; }
  .preview-btn {
    flex: none; cursor: pointer; font-size: 11px; color: #cfe0ff;
    background: rgba(60,90,160,.35); border: 1px solid rgba(120,160,255,.35);
    border-radius: 6px; padding: 2px 8px;
  }
  .preview-btn.active { background: rgba(90,130,255,.6); color: #fff; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; }
  .toggle-row input { accent-color: #5b8cff; }
  #hint { position: fixed; bottom: 12px; right: 14px; color: #7f8ea6; font-size: 11.5px;
    background: rgba(18,22,30,.7); padding: 5px 10px; border-radius: 8px; }
  #hint b { color: #b9c6da; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <h1>相机布局 · 步道场景</h1>
  <div class="sub">数据源：simulation/results/layout_recommended.json</div>

  <h2>方案概览</h2>
  <div class="stat-row"><span>模板</span><span class="v">斜向_B前斜_H后斜</span></div>
  <div class="stat-row"><span>标记平均覆盖</span><span class="v" id="covMean"></span></div>
  <div class="stat-row"><span>标记最小覆盖</span><span class="v" id="covMin"></span></div>
  <div class="stat-row"><span>重建失败率</span><span class="v" id="fail"></span></div>

  <h2>步道</h2>
  <div class="stat-row"><span>总长 × 宽</span><span class="v">4.0 m × 1.2 m</span></div>
  <div class="stat-row"><span>分析窗口</span><span class="v">2.2 m（x −1.1 ~ 1.1）</span></div>
  <div class="stat-row"><span>进入 / 退出段</span><span class="v">0.9 m / 0.9 m</span></div>
  <div class="stat-row"><span>瞄准点</span><span class="v">(0, 0.55, 0) m</span></div>

  <h2>相机</h2>
  <div id="camList"></div>

  <h2>显示</h2>
  <label class="toggle-row"><input type="checkbox" id="tgFrustum" checked> 视锥光束</label>
  <label class="toggle-row"><input type="checkbox" id="tgFoot" checked> 地面覆盖投影</label>
  <label class="toggle-row"><input type="checkbox" id="tgCam" checked> 相机模型</label>
  <label class="toggle-row"><input type="checkbox" id="tgSubject" checked> 行人动画</label>
  <label class="toggle-row"><input type="checkbox" id="tgLabel" checked> 标签</label>
</div>

<div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击 <b>预览</b> 查看相机视角</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============ 布局数据（来自 layout_recommended.json，单位换算为米） ============ */
const AIM = new THREE.Vector3(0, 0.55, 0);            // 瞄准点 (0, 550, 0) mm
const CAMS = [
  { name: 'C1 Basler −45°',  color: 0xff9f43, azDeg: -45,  dist: 3.0, h: 0.30,
    vfovDeg: 50.2688, aspect: 1.0,   model: 'Basler', lens: 12 },
  { name: 'C2 Basler +45°',  color: 0x48dbfb, azDeg:  45,  dist: 3.0, h: 0.60,
    vfovDeg: 50.2688, aspect: 1.0,   model: 'Basler', lens: 12 },
  { name: 'C3 Hik −135°',    color: 0x1dd1a1, azDeg: -135, dist: 3.5, h: 0.30,
    vfovDeg: 22.6145, aspect: 2048/1200, model: 'Hik', lens: 12 },
  { name: 'C4 Hik +135°',    color: 0xf368e0, azDeg:  135, dist: 4.0, h: 0.30,
    vfovDeg: 22.6145, aspect: 2048/1200, model: 'Hik', lens: 12 },
];
// Placement.position 约定：x = aim.x + d·cos(az)，z = aim.z − d·sin(az)
function camPosition(c) {
  const a = THREE.MathUtils.degToRad(c.azDeg);
  return new THREE.Vector3(AIM.x + c.dist * Math.cos(a), c.h, AIM.z - c.dist * Math.sin(a));
}

/* ============ 渲染器 / 场景 / 相机 ============ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const css2d = new CSS2DRenderer({ element: document.createElement('div') });
Object.assign(css2d.domElement.style, { position: 'fixed', inset: 0, pointerEvents: 'none' });
document.body.appendChild(css2d.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171b22);
scene.fog = new THREE.Fog(0x171b22, 14, 30);

const viewCam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 60);
viewCam.position.set(5.2, 3.4, 4.6);
viewCam.lookAt(0, 0.4, 0);

const controls = new OrbitControls(viewCam, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;

/* ============ 光照 ============ */
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a3f4a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6;  sun.shadow.camera.bottom = -6;
scene.add(sun);

/* ============ 地面与网格 ============ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x232833, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(20, 40, 0x3a4252, 0x2a3040);
grid.position.y = 0.001;
scene.add(grid);

// 坐标轴：+X 行走方向（红），+Y 上（绿），+Z 受试者右侧（蓝）
const axes = new THREE.AxesHelper(1.2);
axes.position.y = 0.002;
scene.add(axes);

/* ============ 步道 ============ */
const WALK = { xMin: -2.0, xMax: 2.0, zMin: -0.6, zMax: 0.6, axMin: -1.1, axMax: 1.1 };
const walkwayGroup = new THREE.Group();
scene.add(walkwayGroup);

function flatBox(w, d, color, opacity = 1) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.02, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.8, transparent: opacity < 1, opacity })
  );
  m.receiveShadow = true;
  return m;
}
// 入口段 / 分析区 / 出口段
const entry = flatBox(0.9, 1.2, 0x3d4a63);   entry.position.set(-1.55, 0.011, 0);
const analy = flatBox(2.2, 1.2, 0x2f5d8a);   analy.position.set(0, 0.012, 0);
const exit  = flatBox(0.9, 1.2, 0x3d4a63);   exit.position.set(1.55, 0.011, 0);
// 分析区边界线
const edgeMat = new THREE.LineBasicMaterial({ color: 0x8fc7ff });
for (const xe of [WALK.axMin, WALK.axMax]) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(xe, 0.025, -0.6), new THREE.Vector3(xe, 0.025, 0.6)]);
  walkwayGroup.add(new THREE.Line(g, edgeMat));
}
walkwayGroup.add(entry, analy, exit);

// 行走方向箭头（沿 +X）
function dirArrow(x, z) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0xcfe0ff });
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.005, 0.05), mat);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 12), mat);
  head.rotation.z = -Math.PI / 2;
  head.position.x = 0.26;
  g.add(shaft, head);
  g.position.set(x, 0.035, z);
  return g;
}
walkwayGroup.add(dirArrow(-1.9, 0), dirArrow(0, 0), dirArrow(1.55, 0));

// 中心轨迹虚线
{
  const pts = [];
  for (let x = -2; x <= 2; x += 0.1) pts.push(new THREE.Vector3(x, 0.03, 0));
  walkwayGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({ color: 0x9fb0c8, dashSize: 0.08, gapSize: 0.08 })
  ).computeLineDistances());
}

/* ---- 步道标签 ---- */
function addLabel(text, pos, cls) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  const o = new CSS2DObject(div);
  o.position.copy(pos);
  scene.add(o);
  return o;
}
const labelObjs = [];
labelObjs.push(addLabel('分析区 2.2 m', new THREE.Vector3(0, 0.06, -0.72), 'zone-label'));
labelObjs.push(addLabel('入口 0.9 m', new THREE.Vector3(-1.55, 0.06, -0.72), 'zone-label'));
labelObjs.push(addLabel('出口 0.9 m', new THREE.Vector3(1.55, 0.06, -0.72), 'zone-label'));
labelObjs.push(addLabel('行走方向 +X →', new THREE.Vector3(2.0, 0.35, 0), 'zone-label'));
labelObjs.push(addLabel('宽 1.2 m', new THREE.Vector3(-0.4, 0.06, 0.75), 'zone-label'));

/* ============ 瞄准点标记 ============ */
{
  const aim = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffd93d })
  );
  aim.position.copy(AIM);
  scene.add(aim);
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-0.12, 0.55, 0), new THREE.Vector3(0.12, 0.55, 0),
    new THREE.Vector3(0, 0.55, 0), new THREE.Vector3(0, 0.43, 0),
  ]);
  scene.add(new THREE.LineSegments(g,
    new THREE.LineBasicMaterial({ color: 0xffd93d })));
  labelObjs.push(addLabel('瞄准点 (0, 0.55, 0)', new THREE.Vector3(0, 0.68, 0), 'zone-label'));
}

/* ============ 相机模型 / 视锥 / 地面覆盖 ============ */
const camGroup = new THREE.Group();     // 相机模型
const frustumGroup = new THREE.Group(); // 视锥
const footGroup = new THREE.Group();    // 地面覆盖
scene.add(camGroup, frustumGroup, footGroup);

function makeCamBody(color, isBasler) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x2c313d, roughness: 0.5, metalness: 0.4 });
  const accent = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.3 });
  const bw = isBasler ? 0.09 : 0.11, bh = isBasler ? 0.09 : 0.065;
  const body = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.10), mat);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(bw * 0.9, 0.014, 0.004), accent);
  stripe.position.set(0, bh * 0.3, 0.051);
  const lens = new THREE.Mesh(
    new THREE.CylinderGeometry(0.028, 0.032, 0.07, 20),
    new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 0.3, metalness: 0.6 }));
  lens.rotation.x = Math.PI / 2;
  lens.position.z = 0.08;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.032, 0.006, 10, 24), accent);
  ring.position.z = 0.112;
  g.add(body, stripe, lens, ring);
  body.castShadow = true; lens.castShadow = true;
  return g;
}
function makeTripod(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x3a4050, roughness: 0.6 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 10), mat);
  pole.position.y = -0.5;
  g.add(pole);
  for (let i = 0; i < 3; i++) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.42, 8), mat);
    const a = i * Math.PI * 2 / 3;
    leg.position.set(Math.cos(a) * 0.13, -0.86, Math.sin(a) * 0.13);
    leg.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
    g.add(leg);
  }
  return g;
}

for (const c of CAMS) {
  const pos = camPosition(c);
  c.position = pos;

  // 相机朝向瞄准点
  const body = makeCamBody(c.color, c.model === 'Basler');
  body.position.copy(pos);
  body.lookAt(AIM);
  camGroup.add(body);

  // 三脚架（从机身往下）
  const tri = makeTripod(c.color);
  tri.position.copy(pos);
  camGroup.add(tri);

  // 视锥方向的基准相机（仅用于取向/投影计算）
  const pc = new THREE.PerspectiveCamera(c.vfovDeg, c.aspect, 0.06, 4.2);
  pc.position.copy(pos);
  pc.lookAt(AIM);
  pc.updateMatrixWorld(true);

  // 地面覆盖投影：四条远角射线与 y=0 平面求交
  const pts = [];
  const far = 4.2;
  const halfV = THREE.MathUtils.degToRad(c.vfovDeg) / 2;
  const halfH = Math.atan(Math.tan(halfV) * c.aspect);
  for (const [sy, sx] of [[1, 1], [1, -1], [-1, -1], [-1, 1]]) {
    // 相机局部方向（three 相机看 -Z）
    const dir = new THREE.Vector3(
      sx * Math.tan(halfH), sy * Math.tan(halfV), -1).normalize();
    dir.applyQuaternion(pc.quaternion);
    let t;
    if (dir.y < -1e-6) {
      t = -pos.y / dir.y;                       // 与地面交点
      if (t > far) t = far;
    } else {
      t = far;                                  // 指向上方，取远平面
    }
    pts.push(pos.clone().addScaledVector(dir, t).setY(0.02));
  }
  pts.push(pts[0].clone());
  const fg = new THREE.BufferGeometry().setFromPoints(pts);
  const foot = new THREE.Line(fg, new THREE.LineBasicMaterial({
    color: c.color, transparent: true, opacity: 0.9 }));
  footGroup.add(foot);

  // 面片填充（更直观）
  const fill = new THREE.Mesh(
    new THREE.BufferGeometry().setFromPoints(pts.slice(0, 4))
      .setIndex([0, 1, 2, 0, 2, 3]),
    new THREE.MeshBasicMaterial({ color: c.color, transparent: true,
      opacity: 0.10, side: THREE.DoubleSide, depthWrite: false }));
  footGroup.add(fill);

  // ---- 视锥光束（比线框直观）：相机 → 地面/头部高度面的半透明楔形体 ----
  // 下方角射线打到地面，上方角射线打到人体头部高度平面（1.7 m），
  // 整体表达"该相机能拍到站立人体所在的空间范围"。
  const HEAD_H = 1.7;
  const beamBase = [];
  for (const [sy, sx] of [[1, 1], [1, -1], [-1, -1], [-1, 1]]) {
    const dir = new THREE.Vector3(
      sx * Math.tan(halfH), sy * Math.tan(halfV), -1).normalize();
    dir.applyQuaternion(pc.quaternion);
    let t;
    if (dir.y < -1e-6)       t = -pos.y / dir.y;             // 向下 → 地面 y=0
    else if (dir.y > 1e-6)   t = (HEAD_H - pos.y) / dir.y;   // 向上 → 头部高度面
    else                     t = 12;
    t = Math.min(Math.max(t, 0.3), 12);
    beamBase.push(pos.clone().addScaledVector(dir, t));
  }
  const apex = pos.clone();
  const sideVerts = [];
  for (let i = 0; i < 4; i++) {
    sideVerts.push(apex, beamBase[i], beamBase[(i + 1) % 4]);
  }
  const beam = new THREE.Mesh(
    new THREE.BufferGeometry().setFromPoints(sideVerts),
    new THREE.MeshBasicMaterial({ color: c.color, transparent: true,
      opacity: 0.14, side: THREE.DoubleSide, depthWrite: false }));
  frustumGroup.add(beam);
  // 轮廓：四条棱 + 底面四边形
  const edgePts = [];
  for (let i = 0; i < 4; i++) {
    edgePts.push(apex, beamBase[i],
                 beamBase[i], beamBase[(i + 1) % 4]);
  }
  frustumGroup.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(edgePts),
    new THREE.LineBasicMaterial({ color: c.color, transparent: true, opacity: 0.4 })));
  // 光轴：相机 → 瞄准点
  frustumGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([apex, AIM.clone()]),
    new THREE.LineBasicMaterial({ color: c.color })));

  // 标签
  const labelPos = pos.clone().add(new THREE.Vector3(0, 0.18, 0));
  c.label = addLabel(`${c.name}  d=${c.dist}m h=${c.h}m`, labelPos, 'cam-label');
  c.label.element.style.borderColor = '#' + c.color.toString(16).padStart(6, '0');
}

/* ============ 行人 ============ */
const subject = new THREE.Group();
scene.add(subject);
const skin = new THREE.MeshStandardMaterial({ color: 0xe8eaf0, roughness: 0.6 });
const jointMat = new THREE.MeshBasicMaterial({ color: 0x5b8cff });
const ankleMat = new THREE.MeshBasicMaterial({ color: 0xffd93d });

const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.34, 8, 16), skin);
torso.position.y = 1.18; torso.castShadow = true;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.095, 16, 16), skin);
head.position.y = 1.58; head.castShadow = true;
subject.add(torso, head);

function makeLeg(sideSign) {
  const leg = new THREE.Group();
  // 左右腿沿 Z 轴分开（+Z 受试者右侧），行走方向为 +X
  leg.position.set(0, 0.95, sideSign * 0.09);
  const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.36, 6, 12), skin);
  thigh.position.y = -0.225; thigh.castShadow = true;
  const knee = new THREE.Group();
  knee.position.y = -0.45;
  const shank = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.34, 6, 12), skin);
  shank.position.y = -0.21; shank.castShadow = true;
  const kneeDot = new THREE.Mesh(new THREE.SphereGeometry(0.028, 12, 12), jointMat);
  const ankle = new THREE.Group();
  ankle.position.y = -0.42;
  const ankleDot = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 12), ankleMat);
  // 脚掌长轴沿行走方向 +X
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.035, 0.09), skin);
  foot.position.set(0.05, -0.02, 0); foot.castShadow = true;
  knee.add(shank, kneeDot, ankle);
  ankle.add(ankleDot, foot);
  leg.add(thigh, knee);
  return { leg, knee, ankle };
}
const legR = makeLeg(1);    // +Z 受试者右侧
const legL = makeLeg(-1);
subject.add(legR.leg, legL.leg);

/* ============ 面板：相机列表 ============ */
const covMean = 0.8696, covMin = 0.6667;
document.getElementById('covMean').textContent = (covMean * 100).toFixed(1) + ' %';
document.getElementById('covMin').textContent = (covMin * 100).toFixed(1) + ' %';
document.getElementById('fail').textContent = '0 %';

const camList = document.getElementById('camList');
let previewCam = null, previewIdx = -1;
CAMS.forEach((c, i) => {
  const row = document.createElement('div');
  row.className = 'cam-row';
  row.innerHTML = `
    <span class="dot" style="background:#${c.color.toString(16).padStart(6, '0')}"></span>
    <span class="name">${c.name}<br><span class="meta">${c.model} f=${c.lens}mm · HFOV ${c.aspect === 1 ? c.vfovDeg.toFixed(1) : (2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(c.vfovDeg) / 2) * c.aspect) * 180 / Math.PI).toFixed(1)}°</span></span>
    <span class="preview-btn" data-i="${i}">预览</span>`;
  camList.appendChild(row);
});
camList.addEventListener('click', (e) => {
  const btn = e.target.closest('.preview-btn');
  if (!btn) return;
  const i = +btn.dataset.i;
  if (previewIdx === i) { previewIdx = -1; previewCam = null; }
  else {
    const c = CAMS[i];
    previewCam = new THREE.PerspectiveCamera(c.vfovDeg, c.aspect, 0.02, 30);
    previewCam.position.copy(c.position);
    previewCam.lookAt(AIM);
    previewIdx = i;
  }
  camList.querySelectorAll('.preview-btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.i === previewIdx));
});

/* ============ 开关 ============ */
const bind = (id, fn) => document.getElementById(id).addEventListener('change', e => fn(e.target.checked));
bind('tgFrustum', v => frustumGroup.visible = v);
bind('tgFoot',    v => footGroup.visible = v);
bind('tgCam',     v => camGroup.visible = v);
bind('tgSubject', v => subject.visible = v);
bind('tgLabel',   v => labelObjs.forEach(o => o.visible = v));

/* ============ 动画 ============ */
const clock = new THREE.Clock();
const WALK_SPEED = 0.9;   // m/s
let subjX = -2.3;
const previewW = 340, previewH = Math.round(340 / (16 / 9));

function animateSubject(dt) {
  subjX += WALK_SPEED * dt;
  if (subjX > 2.3) subjX = -2.3;
  subject.position.set(subjX, 0, 0);
  const phase = subjX / 0.045;   // 步频随位置推进
  const swing = 0.55;
  // 前后摆腿绕 Z 轴（正值 = 迈向 +X）；膝屈曲使小腿向后弯（负值）
  legR.leg.rotation.z = swing * Math.sin(phase);
  legL.leg.rotation.z = swing * Math.sin(phase + Math.PI);
  legR.knee.rotation.z = -0.75 * Math.max(0, Math.sin(phase - 0.7));
  legL.knee.rotation.z = -0.75 * Math.max(0, Math.sin(phase - 0.7 + Math.PI));
  // 身体轻微起伏
  subject.position.y = 0.02 * Math.abs(Math.sin(phase));
}

function render() {
  requestAnimationFrame(render);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (subject.visible) animateSubject(dt);
  controls.update();

  // 主视图
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.setScissorTest(false);
  renderer.render(scene, viewCam);
  css2d.render(scene, viewCam);

  // 相机视角画中画
  if (previewCam) {
    const x = innerWidth - previewW - 16, y = 16;
    renderer.setScissorTest(true);
    renderer.setViewport(x, y, previewW, previewH);
    renderer.setScissor(x, y, previewW, previewH);
    renderer.render(scene, previewCam);
    renderer.setScissorTest(false);
  }
}
render();

addEventListener('resize', () => {
  viewCam.aspect = innerWidth / innerHeight;
  viewCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  css2d.setSize(innerWidth, innerHeight);
});
css2d.setSize(innerWidth, innerHeight);
// 调试句柄：控制台可用 window.__viz 访问场景关键对象
window.__viz = { scene, CAMS, camGroup, frustumGroup, subject, legR, legL, AIM, THREE };
</script>
</body>
</html>
